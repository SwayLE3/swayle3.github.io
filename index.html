<html lang="fr">

</head>
<body>
    <div class="repo_wall" id="repoWall"></div>
<div class="last_project">
    <span class="last_project_prompt">&gt;</span>
    <span class="last_project_label">dernier projet :</span>
    <span class="last_project_text">added a flag to OpenFront</span>
    <span class="last_project_cursor"></span>
</div>
<script>
    const favicon = document.getElementById('favicon');
    const normalIcon = 'src/normalIcon.ico';
    const hiddenIcon = 'src/hiddenIcon.ico';

    const repos = [
      { url: 'https://github.com/SwayLE3/ArchConfiture' },
      { url: 'https://github.com/SwayLE3/instagram-chat-chart' },
      { url: 'https://github.com/SwayLE3/Concours-controleur-programmeur-2025-' },
      { profile: true },
      { url: 'https://github.com/SwayLE3/picom-shader-oldCRT-Bloom' },
      { url: 'https://github.com/SwayLE3/mallocNote' },
      { url: 'https://github.com/SwayLE3/TBM-API-interface' },
      { contact: true }
    ];

    const wall = document.getElementById('repoWall');

    const languageColors = {
      Python: '#3572A5', Java: '#b07219', C: '#555555', 'C++': '#f34b7d', 'C#': '#178600',
      Kotlin: '#A97BFF', HTML: '#e34c26', CSS: '#563d7c', JavaScript: '#f1e05a',
      TypeScript: '#3178c6', Shell: '#89e051', GLSL: '#5686a5', Lua: '#000080',
      Rust: '#dea584', Go: '#00ADD8', Dockerfile: '#384d54', Nix: '#7e7eff'
    };

    function timeAgo(date) {
      const s = (Date.now() - new Date(date)) / 1000;
      const units = [['an', 31536000], ['mois', 2592000], ['semaine', 604800], ['jour', 86400], ['heure', 3600], ['minute', 60]];
      for (const [label, secs] of units) {
        const n = Math.floor(s / secs);
        if (n >= 1) return `il y a ${n} ${label}${n > 1 && label !== 'mois' ? 's' : ''}`;
      }
      return "à l'instant";
    }

    function renderCard(card, repo) {
      card.classList.remove('repo_card_loading');
      card.innerHTML = `
        <div class="repo_card_name">${repo.name}</div>
        <div class="repo_card_desc">${repo.description || ''}</div>
        <div class="repo_card_meta">
          <span><i class="repo_card_dot" style="background:${repo.color}"></i>${repo.language}</span>
          <span>★ ${repo.stars}</span>
          <span>⑂ ${repo.forks}</span>
        </div>
        <div class="repo_card_date">${repo.updated}</div>`;
    }

    async function loadRepo(card, url) {
      const path = new URL(url).pathname.replace(/^\/|\/$/g, '');
      const name = path.split('/')[1] || path;
      const key = `repo:${path}`;
      let cached = null;
      try { cached = JSON.parse(localStorage.getItem(key)); } catch (err) {}
      const show = (data) => {
        const language = data.language || '—';
        renderCard(card, {
          name: data.name,
          description: data.description,
          language,
          color: languageColors[language] || '#8d889a',
          stars: data.stargazers_count,
          forks: data.forks_count,
          updated: timeAgo(data.pushed_at)
        });
      };
      if (cached && Date.now() - cached.time < 3600000) return show(cached.data);
      try {
        const res = await fetch(`https://api.github.com/repos/${path}`);
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        try { localStorage.setItem(key, JSON.stringify({ time: Date.now(), data })); } catch (err) {}
        show(data);
      } catch (err) {
        if (cached) return show(cached.data);
        renderCard(card, { name, description: '', language: '—', color: '#8d889a', stars: '—', forks: '—', updated: '' });
      }
    }

    const profileHTML = `
<div class="terminal_fastfetch_container">
  <div>
    <img src="src/avatar.png" alt="avatar" width="161" height="161">
  </div>
  <div class="terminal_fastfetch_infos">
    <div>
      <span class="terminal_fastfetch">User :</span>
      <span class="terminal_bling">SwayLE3@admin</span>
    </div>
    <div>
      <span class="terminal_fastfetch">Age :</span>
      <span class="terminal_bling">19</span>
    </div>
    <div>
      <span class="terminal_fastfetch">Location :</span>
      <span class="terminal_bling">South France</span>
    </div>
    <div>
      <span class="terminal_fastfetch">Hobbies :</span>
      <span class="terminal_bling">Programming, 3d conception, Motorcycle mechanics</span>
    </div>
    <div>
    </div>
  </div>
</div>`;

    const contactHTML = `
    <div class="contact_title">contact :</div>
    <div class="contact_links">
      <a class="contact_link" href="https://www.linkedin.com/in/jules-durot-1a5923434" target="_blank" title="LinkedIn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
        <span>LinkedIn</span>
      </a>
      <a class="contact_link" href="https://www.discordapp.com/users/898447783223250984" target="_blank" title="Discord">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/></svg>
        <span>Discord</span>
      </a>
      <a class="contact_link" href="https://github.com/SwayLE3" target="_blank" title="GitHub">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        <span>GitHub</span>
      </a>
    </div>`;

    function addCard(tag, className, html) {
      const el = document.createElement(tag);
      el.className = className;
      el.innerHTML = html;
      wall.appendChild(el);
    }

    repos.forEach((repo) => {
      if (repo.profile) return addCard('div', 'repo_card repo_card_profile', profileHTML);
      if (repo.contact) return addCard('div', 'repo_card repo_card_contact', contactHTML);
      const card = document.createElement('a');
      card.className = 'repo_card repo_card_loading';
      card.href = repo.url;
      card.target = '_blank';
      card.innerHTML = '<div class="repo_card_name">&nbsp;</div><div class="repo_card_desc"></div>';
      wall.appendChild(card);
      loadRepo(card, repo.url);
    });

    function layoutWall() {
      const cards = wall.children;
      const n = cards.length;
      if (!n) return;
      const ratio = wall.clientWidth / wall.clientHeight;
      const cols = Math.min(n, Math.max(1, Math.round(Math.sqrt(n * ratio))));
      const rows = Math.ceil(n / cols);
      const lastCount = n - cols * (rows - 1);
      wall.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      wall.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
      const base = Math.floor(cols / lastCount);
      const extra = cols % lastCount;
      for (let i = 0; i < n; i++) {
        let span = 1;
        const j = i - cols * (rows - 1);
        if (j >= 0) span = base + (j < extra ? 1 : 0);
        cards[i].style.gridColumn = `span ${span}`;
      }
    }

    layoutWall();
    addEventListener('resize', layoutWall);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        favicon.href = hiddenIcon;
      } else {
        favicon.href = normalIcon;
      }
    });
</script>
</body>
</html>
